# Measures a repository's existing test suite inside a base image: whether it
# passes on a clean checkout, how long it takes, and whether its results hold
# still across identical runs.
#
# This mirrors the BASE half of the platform's pre-solution checks, and nothing
# else -- no test or solution patch is ever applied here:
#   Verify Tests      base must pass on the clean repo
#   Verify Flakiness  no test may change its result between identical runs
#
# Committed ONCE: everything per-run arrives as dispatch inputs, so git history
# never grows.
#
# The base image's registry path is a repository SECRET (IMAGE_PREFIX), never an
# input: secrets are masked from the first line of the log, while inputs print in
# step headers before any ::add-mask:: can take effect. The input is a bare key.
name: measure
run-name: ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:  { description: "opaque id, used to find this run", required: true, type: string }
      repo:        { description: "owner/name", required: true, type: string }
      sha:         { description: "commit to test", required: true, type: string }
      image:       { description: "go | typescript | python | rust | cpp | jvm", required: true, type: string }
      command:     { description: "test command", required: true, type: string }
      timeout_min: { description: "limit per test run; over it means too slow", required: false, type: string, default: "10" }
      runs:        { description: "identical test runs, 2-5, compared for flakiness", required: false, type: string, default: "3" }

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    # Safety net only. The per-stage limits below are what end slow runs and
    # record which stage was slow; this exists for a hang they do not catch.
    timeout-minutes: 120
    steps:
      # Anonymous pulls from the public registry are capped per IP, and runner IPs
      # are shared with everyone on GitHub: 7 of the first 11 pulls were refused.
      # So each base image is cached in this repo after its first good pull, keyed
      # by ISO week so a changed upstream image is picked up within a week.
      - name: week
        id: wk
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: restore base image
        id: img
        uses: actions/cache/restore@v4
        with:
          path: /tmp/img.tar
          key: img-${{ inputs.image }}-${{ steps.wk.outputs.week }}
          restore-keys: img-${{ inputs.image }}-

      - name: measure
        env:
          CACHE_HIT: ${{ steps.img.outputs.cache-hit }}
          IMAGE_PREFIX: ${{ secrets.IMAGE_PREFIX }}
          IN_REPO: ${{ inputs.repo }}
          IN_SHA: ${{ inputs.sha }}
          IN_IMAGE: ${{ inputs.image }}
          IN_CMD: ${{ inputs.command }}
          IN_TIMEOUT: ${{ inputs.timeout_min }}
          IN_RUNS: ${{ inputs.runs }}
          IN_ID: ${{ inputs.request_id }}
        run: |
          # GitHub runs this with bash -e. Failures are recorded per stage instead of
          # aborting the script, so errexit is switched off; every stage keeps its rc.
          set +e -u
          mkdir -p out
          : > out/stages.txt

          # Shape-check the inputs before they reach a shell. The command is the one
          # free-form field, and running it is the point of the job.
          [[ "$IN_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bad repo"; exit 2; }
          [[ "$IN_SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "bad sha"; exit 2; }
          case "$IN_IMAGE" in go|typescript|python|rust|cpp|jvm) ;; *) echo "bad image"; exit 2;; esac
          [[ "$IN_TIMEOUT" =~ ^[0-9]+$ ]] || IN_TIMEOUT=10
          [[ "$IN_RUNS" =~ ^[2-5]$ ]] || IN_RUNS=3
          IMAGE="${IMAGE_PREFIX}${IN_IMAGE}:latest"

          now() { date +%s.%N; }
          # Scrub the registry path out of anything that lands in the artifact.
          # Masking covers the job log only; the artifact is downloadable while the
          # run exists.
          scrub() { python3 -c 'import sys; p=sys.argv[1]; d=sys.stdin.read(); sys.stdout.write(d.replace(p,"<base>/") if p else d)' "$IMAGE_PREFIX"; }

          # Per-test outcomes for one run, read the way each framework already
          # reports them -- the test command itself is never modified.
          parse_tests() {
            python3 - "$1" <<'PY'
          import glob, json, re, sys
          import xml.etree.ElementTree as ET
          name = sys.argv[1]
          log = open(f"out/{name}.log", encoding="utf-8", errors="replace").read()
          log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", log)
          tests, how = {}, "none"

          # JUnit XML the framework writes itself: Maven surefire and Gradle by
          # default, pytest through PYTEST_ADDOPTS. Cleared before every run.
          xmls = (glob.glob("src/**/target/surefire-reports/*.xml", recursive=True)
                  + glob.glob("src/**/build/test-results/**/*.xml", recursive=True)
                  + glob.glob("src/.bench-junit/*.xml"))
          for f in xmls:
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter("testcase"):
                  tid = f"{tc.get('classname', '')}::{tc.get('name', '')}"
                  st = "pass"
                  for ch in tc:
                      if ch.tag in ("failure", "error"):
                          st = "fail"
                      elif ch.tag == "skipped" and st == "pass":
                          st = "skip"
                  tests[tid] = st
          if tests:
              how = "per-test (junit)"

          # Go, made verbose through GOFLAGS=-v. A package's tests print BEFORE its
          # "ok"/"FAIL" summary line, so they are held until that line names the
          # package -- the package is the area a test.sh exclusion is written against.
          if not tests:
              pending = []
              for line in log.splitlines():
                  m = re.match(r"\s*--- (PASS|FAIL|SKIP): (\S+)", line)
                  if m:
                      pending.append((m.group(2), {"PASS": "pass", "FAIL": "fail", "SKIP": "skip"}[m.group(1)]))
                      continue
                  m = re.match(r"(ok|FAIL)\s+(\S+)", line)
                  if m and pending:
                      for t, st in pending:
                          tests[f"{m.group(2)}::{t}"] = st
                      pending = []
              for t, st in pending:  # a package that crashed before its summary line
                  tests[f"?::{t}"] = st
              if tests:
                  how = "per-test (go -v)"

          # Cargo lists every test by default. Names repeat across test binaries, so
          # each is prefixed with the binary it ran in.
          if not tests:
              binary = ""
              for line in log.splitlines():
                  m = re.match(r"\s*Running (?:unittests )?(\S+)", line)
                  if m:
                      binary = m.group(1)
                      continue
                  if line.strip().startswith("Doc-tests"):
                      binary = line.strip()
                      continue
                  m = re.match(r"test (.+?) \.\.\. (ok|FAILED|ignored)", line)
                  if m:
                      tests[f"{binary}::{m.group(1)}"] = {"ok": "pass", "FAILED": "fail", "ignored": "skip"}[m.group(2)]
              if tests:
                  how = "per-test (cargo)"

          # Jest and Vitest report per FILE by default, not per test.
          if not tests:
              for m in re.finditer(r"^\s*(PASS|FAIL) (\S+)", log, re.M):
                  tests["file::" + m.group(2)] = "pass" if m.group(1) == "PASS" else "fail"
              for m in re.finditer(r"^\s*([✓×❯]) (\S+\.[cm]?[jt]sx?)\b", log, re.M):
                  tests["file::" + m.group(2)] = "pass" if m.group(1) == "✓" else "fail"
              if tests:
                  how = "per-file (jest/vitest)"

          json.dump({"how": how, "tests": tests}, open(f"out/{name}.tests.json", "w"))
          PY
          }

          stage() {
            local name=$1; shift
            local t0 t1 rc
            t0=$(now); "$@" > "out/$name.log" 2>&1; rc=$?; t1=$(now)
            echo "$name $rc $(python3 -c "print(round($t1-$t0,2))")" >> out/stages.txt
            case "$name" in test_*) parse_tests "$name" ;; esac
            tail -c 20000 "out/$name.log" | scrub > "out/$name.tail"; rm -f "out/$name.log"
            return $rc
          }

          echo "cpus=$(nproc) mem_mb=$(free -m | awk '/Mem:/{print $2}')" > out/runner.txt

          finish() {
            python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path("out")
          stages = {}
          for line in (out / "stages.txt").read_text().splitlines():
              n, rc, s = line.split()
              tail = out / f"{n}.tail"
              stages[n] = {"rc": int(rc), "seconds": float(s),
                           "tail": tail.read_text(encoding="utf-8", errors="replace") if tail.exists() else ""}

          def problem_areas(flaky, always_fail):
              # The part of a test id before "::" is its package, module, class or
              # file -- the unit a test.sh exclusion and a task's blast radius are
              # expressed in.
              areas = {}
              for kind, ids in (("flaky", flaky), ("always_fail", always_fail)):
                  for t in ids:
                      a = t.split("::", 1)[0] or "?"
                      areas.setdefault(a, {"flaky": 0, "always_fail": 0})[kind] += 1
              return dict(sorted(areas.items(), key=lambda kv: -sum(kv[1].values()))[:30])

          # The base verdict across identical runs: does the suite pass on a clean
          # checkout every time, and does any test change its result between runs?
          runs = [n for n in stages if n.startswith("test_")]
          done = [n for n in runs if stages[n]["rc"] not in (-1, 124)]
          per = {}
          for n in done:
              f = out / f"{n}.tests.json"
              if f.exists():
                  per[n] = json.loads(f.read_text())
          ids = set()
          for p in per.values():
              ids |= set(p["tests"])
          # A test missing from one run counts as changing result: the platform sees
          # the same disagreement whichever way it arose.
          flaky = sorted(t for t in ids if len({p["tests"].get(t, "absent") for p in per.values()}) > 1)
          always_fail = sorted(t for t in ids if per and all(p["tests"].get(t) == "fail" for p in per.values()))
          base = {
              "runs_completed": len(done),
              "runs_timed_out": sum(1 for n in runs if stages[n]["rc"] == 124),
              "passes": bool(done) and all(stages[n]["rc"] == 0 for n in done),
              "exit_codes": [stages[n]["rc"] for n in runs],
              # Different exit codes across identical runs is flakiness even when no
              # per-test detail could be read.
              "exit_code_unstable": len({stages[n]["rc"] for n in done}) > 1,
              "granularity": sorted({p["how"] for p in per.values()}) or ["none"],
              "counts": {n: {k: sum(1 for v in p["tests"].values() if v == k)
                             for k in ("pass", "fail", "skip")} for n, p in per.items()},
              "flaky_count": len(flaky), "flaky": flaky[:50],
              # Failing in EVERY run is deterministic -- excludable in test.sh with a
              # reason -- which is a different finding from a suite that flickers.
              "always_fail_count": len(always_fail), "always_fail": always_fail[:50],
              # Where the problems are. Tests outside the area a task touches can be
              # excluded; tests inside it cannot, so this is what decides whether a
              # flaky repo is still usable and where in it a task can live.
              "problem_areas": problem_areas(flaky, always_fail),
              "tests_ran_offline": (out / "test_network").exists()
                                   and (out / "test_network").read_text().strip() == "none",
          }
          json.dump({
              "request_id": os.environ["IN_ID"], "repo": os.environ["IN_REPO"],
              "sha": os.environ["IN_SHA"], "image": os.environ["IN_IMAGE"],
              "command": os.environ["IN_CMD"], "timeout_min": os.environ["IN_TIMEOUT"],
              "runner": (out / "runner.txt").read_text().strip(),
              "ran_as": "root", "stages": stages, "base": base,
              "image_source": (out / "image_source").read_text().strip()
                              if (out / "image_source").exists() else "none",
          }, open(out / "result.json", "w"), indent=1)
          PY
          }
          trap finish EXIT

          # Clone on the host: shallow fetch by SHA, full clone if the SHA is short.
          stage clone timeout 5m bash -c 'git init -q src && git -C src fetch -q --depth 1 "https://github.com/$IN_REPO" "$IN_SHA" && git -C src checkout -q FETCH_HEAD' \
            || stage clone_full timeout 5m bash -c 'rm -rf src && git clone -q "https://github.com/$IN_REPO" src && git -C src checkout -q "$IN_SHA"' \
            || exit 0
          stage submodules git -C src submodule update --init --recursive --depth 1 -q || true

          # This week's cached image if there is one. Otherwise pull, and cache what
          # was pulled. If the registry refuses, an older week's image beats no
          # measurement at all -- recorded as stale so it is never mistaken for fresh.
          if [ "$CACHE_HIT" = "true" ] && [ -f /tmp/img.tar ]; then
            echo cache > out/image_source
            stage load docker load -i /tmp/img.tar || exit 0
          elif stage pull timeout 10m docker pull -q "$IMAGE"; then
            echo registry > out/image_source
            docker save -o /tmp/img.tar "$IMAGE" && : > out/save_cache
          elif [ -f /tmp/img.tar ]; then
            echo stale-cache > out/image_source
            stage load docker load -i /tmp/img.tar || exit 0
          else
            exit 0
          fi

          # One long-lived container so install and every test run share state.
          # Docker names need at least two characters -- "w" fails before anything runs.
          # Root avoids uid clashes on the bind mount; a few suites behave
          # differently as root, which is recorded in the result.
          # Mounted at /app because that is the platform's WORKDIR: a test that builds
          # a path from its own location should see the same path it will be graded at.
          docker run -d --name bench --user 0:0 -v "$PWD/src:/app" -w /app --entrypoint sleep "$IMAGE" infinity >/dev/null || exit 0

          # Base-image traps, applied before anything runs -- each makes a healthy
          # repo look broken if ignored. The result-cache switches keep repeat runs
          # honest: a second `go test` would otherwise print "(cached)" and execute
          # nothing. The report switches make per-test results readable without
          # changing the test command.
          case "$IN_IMAGE" in
            typescript) ENVSH='export CI=true NO_COLOR=1 FORCE_COLOR=0 NODE_ENV=development TURBO_FORCE=true NX_SKIP_NX_CACHE=true' ;;   # NODE_ENV=production drops devDeps
            go)         ENVSH='export CI=true NO_COLOR=1 GOFLAGS="-count=1 -v"' ;;
            python)     ENVSH='export CI=true NO_COLOR=1 FORCE_COLOR=0 PYTEST_ADDOPTS=--junitxml=/app/.bench-junit/pytest.xml' ;;
            rust)       ENVSH='export CI=true NO_COLOR=1 CARGO_TERM_COLOR=never PATH=/opt/cargo/bin:$PATH' ;;  # cargo is not on PATH
            *)          ENVSH='export CI=true NO_COLOR=1 FORCE_COLOR=0' ;;
          esac
          docker exec -i bench bash -c 'cat > /tmp/env.sh' <<< "$ENVSH"

          case "$IN_IMAGE" in
            typescript) INSTALL='if [ -f pnpm-lock.yaml ]; then corepack enable >/dev/null 2>&1; pnpm install --frozen-lockfile --prod=false || pnpm install --prod=false; elif [ -f yarn.lock ]; then corepack enable >/dev/null 2>&1; yarn install --frozen-lockfile --production=false || yarn install --production=false; elif [ -f package-lock.json ]; then npm ci --include=dev; else npm install --include=dev; fi' ;;
            go)         INSTALL='go mod download' ;;
            python)     INSTALL='python -m pip install -q -e . || python -m pip install -q -r requirements.txt; python -m pip install -q pytest' ;;  # never .[all]
            rust)       INSTALL='cargo fetch' ;;
            jvm)        INSTALL='mkdir -p ~/.gradle && printf "org.gradle.java.installations.paths=/opt/jdk-25\norg.gradle.java.installations.auto-download=false\n" >> ~/.gradle/gradle.properties; if [ -x ./gradlew ]; then ./gradlew --no-daemon -q dependencies >/dev/null || true; elif [ -f pom.xml ]; then mvn -q -B dependency:go-offline || true; fi' ;;
            cpp)        INSTALL='true' ;;
          esac
          # bash -c, not -lc: a login shell re-reads /etc/profile and resets the
          # PATH the image set, which hides go, cargo and friends.
          stage install docker exec -e INSTALL="$INSTALL" bench bash -c '. /tmp/env.sh; timeout 15m bash -c "$INSTALL"' || true

          # The platform builds with network and runs every test with --network none.
          # So installs happen online and tests offline, here too. A test that reaches
          # the network then fails in every run and lands in always_fail -- which is
          # exactly where it belongs, as an exclusion it needs in test.sh.
          if docker network disconnect bridge bench >/dev/null 2>&1; then
            echo none > out/test_network
          else
            echo "connected (disconnect failed)" > out/test_network
          fi

          # Every run starts with no test reports, so each run's results are its own.
          # Removing Gradle's results also stops it skipping the test task as
          # up-to-date, while compilation stays cached.
          clear_results() {
            docker exec bench bash -c "find . \( -name node_modules -o -name .git \) -prune -o -type d \( -path '*/build/test-results' -o -path '*/target/surefire-reports' \) -prune -exec rm -rf {} + ; rm -rf .bench-junit" >/dev/null 2>&1
            return 0
          }
          run_tests() {
            stage "$1" docker exec -e IN_CMD="$IN_CMD" -e T="$IN_TIMEOUT" bench bash -c '. /tmp/env.sh; timeout "${T}m" bash -c "$IN_CMD"'
          }
          run_name() { case "$1" in 1) echo test_cold ;; 2) echo test_warm ;; *) echo "test_run$1" ;; esac; }

          # The first run pays for compilation and cold caches; the rest are the
          # honest timing, and all of them are compared for flakiness. If the first
          # hit the limit, further runs would only continue the same build -- as
          # slang showed -- so they are recorded as skipped instead.
          clear_results; run_tests test_cold; cold=$?
          for i in $(seq 2 "$IN_RUNS"); do
            n=$(run_name "$i")
            if [ "$cold" = 124 ]; then
              echo "$n -1 0" >> out/stages.txt
              echo "skipped: the cold run hit the time limit, so another run would only continue the same build" > "out/$n.tail"
            else
              clear_results; run_tests "$n"
            fi
          done

      - name: save base image
        if: always() && steps.img.outputs.cache-hit != 'true' && hashFiles('out/save_cache') != ''
        uses: actions/cache/save@v4
        with:
          path: /tmp/img.tar
          key: img-${{ inputs.image }}-${{ steps.wk.outputs.week }}

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: out/result.json
          retention-days: 1
          if-no-files-found: ignore
