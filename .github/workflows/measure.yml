# Measures how long a repository's existing test suite takes inside a base image.
#
# Copy to .github/workflows/measure.yml in the runner repo. It is committed ONCE:
# everything per-run arrives as dispatch inputs, so git history never grows.
#
# The base image's registry path is a repository SECRET (IMAGE_PREFIX), never an
# input: secrets are masked from the first line of the log, while inputs print in
# step headers before any ::add-mask:: can take effect. The input is a bare key.
name: measure
run-name: ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:  { description: "opaque id, used to find this run", required: true, type: string }
      repo:        { description: "owner/name", required: true, type: string }
      sha:         { description: "commit to test", required: true, type: string }
      image:       { description: "go | typescript | python | rust | cpp | jvm", required: true, type: string }
      command:     { description: "test command", required: true, type: string }
      timeout_min: { description: "limit per test run; over it means too slow", required: false, type: string, default: "10" }

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    # Safety net only. The per-stage limits below are what end slow runs and
    # record which stage was slow; this exists for a hang they do not catch.
    timeout-minutes: 120
    steps:
      # Anonymous pulls from the public registry are capped per IP, and runner IPs
      # are shared with everyone on GitHub: 7 of the first 11 pulls were refused.
      # So each base image is cached in this repo after its first good pull, keyed
      # by ISO week so a changed upstream image is picked up within a week.
      - name: week
        id: wk
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: restore base image
        id: img
        uses: actions/cache/restore@v4
        with:
          path: /tmp/img.tar
          key: img-${{ inputs.image }}-${{ steps.wk.outputs.week }}
          restore-keys: img-${{ inputs.image }}-

      - name: measure
        env:
          CACHE_HIT: ${{ steps.img.outputs.cache-hit }}
          IMAGE_PREFIX: ${{ secrets.IMAGE_PREFIX }}
          IN_REPO: ${{ inputs.repo }}
          IN_SHA: ${{ inputs.sha }}
          IN_IMAGE: ${{ inputs.image }}
          IN_CMD: ${{ inputs.command }}
          IN_TIMEOUT: ${{ inputs.timeout_min }}
          IN_ID: ${{ inputs.request_id }}
        run: |
          # GitHub runs this with bash -e. Failures are recorded per stage instead of
          # aborting the script, so errexit is switched off; every stage keeps its rc.
          set +e -u
          mkdir -p out
          : > out/stages.txt

          # Shape-check the inputs before they reach a shell. The command is the one
          # free-form field, and running it is the point of the job.
          [[ "$IN_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bad repo"; exit 2; }
          [[ "$IN_SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "bad sha"; exit 2; }
          case "$IN_IMAGE" in go|typescript|python|rust|cpp|jvm) ;; *) echo "bad image"; exit 2;; esac
          [[ "$IN_TIMEOUT" =~ ^[0-9]+$ ]] || IN_TIMEOUT=10
          IMAGE="${IMAGE_PREFIX}${IN_IMAGE}:latest"

          now() { date +%s.%N; }
          # Scrub the registry path out of anything that lands in the artifact.
          # Masking covers the job log only; the artifact is downloadable while the
          # run exists.
          scrub() { python3 -c 'import sys; p=sys.argv[1]; d=sys.stdin.read(); sys.stdout.write(d.replace(p,"<base>/") if p else d)' "$IMAGE_PREFIX"; }
          stage() {
            local name=$1; shift
            local t0 t1 rc
            t0=$(now); "$@" > "out/$name.log" 2>&1; rc=$?; t1=$(now)
            echo "$name $rc $(python3 -c "print(round($t1-$t0,2))")" >> out/stages.txt
            tail -c 20000 "out/$name.log" | scrub > "out/$name.tail"; rm -f "out/$name.log"
            return $rc
          }

          echo "cpus=$(nproc) mem_mb=$(free -m | awk '/Mem:/{print $2}')" > out/runner.txt

          finish() {
            python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path("out")
          stages = {}
          for line in (out / "stages.txt").read_text().splitlines():
              n, rc, s = line.split()
              tail = out / f"{n}.tail"
              stages[n] = {"rc": int(rc), "seconds": float(s),
                           "tail": tail.read_text(errors="replace") if tail.exists() else ""}
          json.dump({
              "request_id": os.environ["IN_ID"], "repo": os.environ["IN_REPO"],
              "sha": os.environ["IN_SHA"], "image": os.environ["IN_IMAGE"],
              "command": os.environ["IN_CMD"], "timeout_min": os.environ["IN_TIMEOUT"],
              "runner": (out / "runner.txt").read_text().strip(),
              "ran_as": "root", "stages": stages,
              "image_source": (out / "image_source").read_text().strip()
                              if (out / "image_source").exists() else "none",
          }, open(out / "result.json", "w"), indent=1)
          PY
          }
          trap finish EXIT

          # Clone on the host: shallow fetch by SHA, full clone if the SHA is short.
          stage clone timeout 5m bash -c 'git init -q src && git -C src fetch -q --depth 1 "https://github.com/$IN_REPO" "$IN_SHA" && git -C src checkout -q FETCH_HEAD' \
            || stage clone_full timeout 5m bash -c 'rm -rf src && git clone -q "https://github.com/$IN_REPO" src && git -C src checkout -q "$IN_SHA"' \
            || exit 0
          stage submodules git -C src submodule update --init --recursive --depth 1 -q || true

          # This week's cached image if there is one. Otherwise pull, and cache what
          # was pulled. If the registry refuses, an older week's image beats no
          # measurement at all -- recorded as stale so it is never mistaken for fresh.
          if [ "$CACHE_HIT" = "true" ] && [ -f /tmp/img.tar ]; then
            echo cache > out/image_source
            stage load docker load -i /tmp/img.tar || exit 0
          elif stage pull timeout 10m docker pull -q "$IMAGE"; then
            echo registry > out/image_source
            docker save -o /tmp/img.tar "$IMAGE" && : > out/save_cache
          elif [ -f /tmp/img.tar ]; then
            echo stale-cache > out/image_source
            stage load docker load -i /tmp/img.tar || exit 0
          else
            exit 0
          fi

          # One long-lived container so install and both test runs share state.
          # Docker names need at least two characters -- "w" fails before anything runs.
          # Root avoids uid clashes on the bind mount; a few suites behave
          # differently as root, which is recorded in the result.
          docker run -d --name bench --user 0:0 -v "$PWD/src:/work" -w /work --entrypoint sleep "$IMAGE" infinity >/dev/null || exit 0

          # Base-image traps, applied before anything runs. Each of these makes a
          # healthy repo look broken if ignored.
          # The result-cache switches keep the WARM run honest: it should reuse the
          # build, not replay the cold run's results. Without -count=1 a second
          # `go test` prints "(cached)" for every package and executes nothing.
          case "$IN_IMAGE" in
            typescript) ENVSH='export CI=true NO_COLOR=1 FORCE_COLOR=0 NODE_ENV=development TURBO_FORCE=true NX_SKIP_NX_CACHE=true' ;;   # NODE_ENV=production drops devDeps
            go)         ENVSH='export CI=true NO_COLOR=1 GOFLAGS=-count=1' ;;
            rust)       ENVSH='export CI=true NO_COLOR=1 CARGO_TERM_COLOR=never PATH=/opt/cargo/bin:$PATH' ;;  # cargo is not on PATH
            *)          ENVSH='export CI=true NO_COLOR=1 FORCE_COLOR=0' ;;
          esac
          docker exec -i bench bash -c 'cat > /tmp/env.sh' <<< "$ENVSH"

          case "$IN_IMAGE" in
            typescript) INSTALL='if [ -f pnpm-lock.yaml ]; then corepack enable >/dev/null 2>&1; pnpm install --frozen-lockfile --prod=false || pnpm install --prod=false; elif [ -f yarn.lock ]; then corepack enable >/dev/null 2>&1; yarn install --frozen-lockfile --production=false || yarn install --production=false; elif [ -f package-lock.json ]; then npm ci --include=dev; else npm install --include=dev; fi' ;;
            go)         INSTALL='go mod download' ;;
            python)     INSTALL='python -m pip install -q -e . || python -m pip install -q -r requirements.txt; python -m pip install -q pytest' ;;  # never .[all]
            rust)       INSTALL='cargo fetch' ;;
            jvm)        INSTALL='mkdir -p ~/.gradle && printf "org.gradle.java.installations.paths=/opt/jdk-25\norg.gradle.java.installations.auto-download=false\n" >> ~/.gradle/gradle.properties; if [ -x ./gradlew ]; then ./gradlew --no-daemon -q dependencies >/dev/null || true; elif [ -f pom.xml ]; then mvn -q -B dependency:go-offline || true; fi' ;;
            cpp)        INSTALL='true' ;;
          esac
          # bash -c, not -lc: a login shell re-reads /etc/profile and resets the
          # PATH the image set, which hides go, cargo and friends.
          stage install docker exec -e INSTALL="$INSTALL" bench bash -c '. /tmp/env.sh; timeout 15m bash -c "$INSTALL"' || true

          # Twice: the first run pays for compilation and cold caches.
          # Gradle skips a test task whose outputs exist; removing them forces the
          # tests to run while compilation stays up to date.
          clear_results() {
            [ "$IN_IMAGE" = jvm ] && docker exec bench bash -c "find . -type d -path '*/build/test-results' -prune -exec rm -rf {} +" >/dev/null 2>&1
            return 0
          }
          run_tests() {
            stage "$1" docker exec -e IN_CMD="$IN_CMD" -e T="$IN_TIMEOUT" bench bash -c '. /tmp/env.sh; timeout "${T}m" bash -c "$IN_CMD"'
          }

          clear_results; run_tests test_cold; cold=$?
          # Twice: the first run pays for compilation and cold caches. But if the
          # first run hit the limit, a second one is not a warm run -- it just
          # carries on the same build, as slang showed, and burns another limit.
          if [ "$cold" = 124 ]; then
            echo "test_warm -1 0" >> out/stages.txt
            echo "skipped: the cold run hit the time limit, so a second run would only continue the same build" > out/test_warm.tail
          else
            clear_results; run_tests test_warm
          fi

      - name: save base image
        if: always() && steps.img.outputs.cache-hit != 'true' && hashFiles('out/save_cache') != ''
        uses: actions/cache/save@v4
        with:
          path: /tmp/img.tar
          key: img-${{ inputs.image }}-${{ steps.wk.outputs.week }}

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: out/result.json
          retention-days: 1
          if-no-files-found: ignore
